<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Spotify CD Player login</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #666; --accent: #1f6feb; --border: #d0d7de; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #aaa; --accent: #58a6ff; --border: #333; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 32rem; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  .muted { color: var(--muted); }
  a.button { display: inline-block; padding: .75rem 1.25rem; border-radius: .5rem; background: var(--accent);
             color: #fff; text-decoration: none; font-weight: 600; }
  textarea { width: 100%; box-sizing: border-box; min-height: 5rem; font: 13px/1.4 ui-monospace, monospace;
             padding: .5rem; border: 1px solid var(--border); border-radius: .5rem; background: transparent; color: inherit; }
  button { margin-top: .5rem; padding: .5rem 1rem; border-radius: .5rem; border: 1px solid var(--border);
           background: transparent; color: inherit; font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Returning to your Spotify CD Player…</h1>
  <p id="message" class="muted">One moment.</p>
  <div id="fallback" hidden>
    <p><a id="continue" class="button" href="#">Continue to Spotify CD Player</a></p>
    <p class="muted">If that doesn't work, copy this address and paste it into
      <strong>Spotify → Paste login link</strong> on your Spotify CD Player's setup page.</p>
    <textarea id="link" readonly></textarea>
    <button id="copy" type="button">Copy</button>
  </div>
</main>
<script>
  // OAuth relay for Spotify CD Player (PLAN.md §6.2). Static, no secrets: PKCE keeps the
  // code useless without the verifier, which never leaves the device.
  // state = <nonce>~<private IPv4>~<port>; only RFC 1918 addresses are forwarded.
  (function () {
    const query = new URLSearchParams(location.search);
    const state = query.get("state") || "";
    const [nonce, host, port] = state.split("~");
    const privateIPv4 = /^(10(\.\d{1,3}){3}|192\.168(\.\d{1,3}){2}|172\.(1[6-9]|2\d|3[01])(\.\d{1,3}){2})$/;
    const octetsOk = host && host.split(".").every((o) => Number(o) <= 255);
    const portOk = /^\d{1,5}$/.test(port || "") && Number(port) > 0 && Number(port) < 65536;

    const title = document.getElementById("title");
    const message = document.getElementById("message");

    if (!nonce || !privateIPv4.test(host || "") || !octetsOk || !portOk) {
      title.textContent = "This link can't be used";
      message.textContent = "It doesn't point to a Spotify CD Player on your home network. Start the login again from the device.";
      return;
    }

    const forward = new URLSearchParams({ state: state });
    for (const key of ["code", "error"]) {
      if (query.has(key)) forward.set(key, query.get(key));
    }
    const target = "http://" + host + ":" + port + "/spotify/callback?" + forward.toString();

    document.getElementById("continue").href = target;
    document.getElementById("link").value = target;
    document.getElementById("copy").addEventListener("click", async () => {
      const box = document.getElementById("link");
      try { await navigator.clipboard.writeText(box.value); } catch (e) { box.select(); document.execCommand("copy"); }
      document.getElementById("copy").textContent = "Copied";
    });

    // Remove the code from this page's address and history before leaving.
    history.replaceState(null, "", location.pathname);
    setTimeout(() => {
      title.textContent = "Almost done";
      message.textContent = "Your browser stayed on this page. Make sure your phone is on the same Wi-Fi as the Spotify CD Player.";
      document.getElementById("fallback").hidden = false;
    }, 2000);
    location.replace(target);
  })();
</script>
</body>
</html>
