; Card Player — NFC Spotify controller
; Waveshare ESP32-S3-Touch-LCD-1.47 + PN532 V3 + MIFARE Classic 1K
;
; Phase 0: one environment per hardware spike (see PLAN.md §15 and docs/spikes.md).
;   pio run -e s1_display -t upload && pio device monitor -e s1_display

[platformio]
default_envs = s1_display

[env]
; pioarduino: Arduino core 3.3.12 on ESP-IDF 5.5.5. Upgrade deliberately.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi      ; ESP32-S3R8: quad flash + octal PSRAM
board_build.partitions = default_16MB.csv      ; 2 x ~6.25 MB OTA slots + coredump
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_echo = yes
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Iinclude
build_src_filter = -<*>

; S1 — display, touch, LVGL, backlight, panel sleep, CPU clock, Wi-Fi power save
[env:s1_display]
build_src_filter = +<spikes/common/> +<spikes/s1_display/>
build_flags = ${env.build_flags} -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
  lvgl/lvgl@9.5.0
  moononournation/GFX Library for Arduino@1.6.8  ; 1.5.9 (vendor-tested) fails on core >= 3.3.6

; S2 — PN532 over SPI3, NDEF on MIFARE Classic, RF field control
[env:s2_nfc]
build_src_filter = +<spikes/common/> +<spikes/s2_nfc/>
lib_deps =
  https://github.com/Seeed-Studio/Seeed_Arduino_NFC.git#3a55a631f23e986babf5e5fa625cc43d1bf99897

; S3 + S4 — TLS to api.spotify.com, keep-alive, and a Spotify Web API console
[env:s3_net]
build_src_filter = +<spikes/common/> +<spikes/s3_net/>
lib_deps =
  bblanchon/ArduinoJson@7.4.3
