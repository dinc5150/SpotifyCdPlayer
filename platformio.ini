; Card Player — NFC Spotify controller
; Waveshare ESP32-S3-Touch-LCD-1.47 + PN532 V3 + MIFARE Classic 1K
;
; Run pio from PowerShell or the VS Code PlatformIO sidebar, not Git Bash
; (ESP-IDF's installer refuses MSYS).
;   pio run -e dev -t upload && pio device monitor -e dev   ; firmware with serial console
;   pio run -e device -t upload                             ; release firmware
;   pio test -e test_device                                 ; unit tests on the board
;   pio test -e native                                      ; unit tests on the PC (needs gcc/g++)

[platformio]
default_envs = dev

[env]
; pioarduino: Arduino core 3.3.12 on ESP-IDF 5.5.5. Upgrade deliberately.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi      ; ESP32-S3R8: quad flash + octal PSRAM
board_build.partitions = default_16MB.csv      ; 2 x ~6.25 MB OTA slots + coredump
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_echo = yes
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Iinclude
build_src_filter = -<*>

; ---------------------------------------------------------------------------
; Firmware (PLAN.md §5.7)

[firmware]
build_src_filter = +<*> -<spikes/>
build_flags = ${env.build_flags} -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
  lvgl/lvgl@9.5.0
  moononournation/GFX Library for Arduino@1.6.8  ; 1.5.9 (vendor-tested) fails on core >= 3.3.6

[env:device]
build_type = release
build_src_filter = ${firmware.build_src_filter}
build_flags = ${firmware.build_flags} -DCORE_DEBUG_LEVEL=2
lib_deps = ${firmware.lib_deps}

; Release optimisation too: build_type = debug makes PlatformIO install OpenOCD
; (which fails on this machine) and slows LVGL, skewing latency measurements.
; Core log level 3, not 4: level 4 prints a memory report before setup() that
; stalls boot for seconds when no serial monitor is reading. Our own logs
; (util/Log) still default to debug in this build.
[env:dev]
build_type = release
build_src_filter = ${firmware.build_src_filter}
build_flags = ${firmware.build_flags} -DCORE_DEBUG_LEVEL=3 -DENABLE_SERIAL_CONSOLE=1
lib_deps = ${firmware.lib_deps}

; ---------------------------------------------------------------------------
; Unit tests for the pure-logic modules (test/test_logic). Same tests, two hosts.

[logic]
build_src_filter =
  -<*>
  +<app/StateMachine.cpp>
  +<storage/SettingsRules.cpp>
  +<util/Backoff.cpp>
  +<util/ButtonGesture.cpp>

[env:native]
platform = native
framework =
board =
test_framework = unity
test_build_src = yes
build_src_filter = ${logic.build_src_filter}
build_flags = -std=gnu++17 -Iinclude -Isrc

[env:test_device]
test_framework = unity
test_build_src = yes
build_src_filter = ${logic.build_src_filter}
build_flags = ${env.build_flags} -Isrc

; ---------------------------------------------------------------------------
; Phase 0 spikes (docs/spikes.md). Kept buildable for re-measuring hardware.

; S1 — display, touch, LVGL, backlight, panel sleep, CPU clock, Wi-Fi power save
[env:s1_display]
build_src_filter = +<spikes/s1_display/> +<ui/LvglMemory.cpp>
build_flags = ${env.build_flags} -DLV_CONF_INCLUDE_SIMPLE
lib_deps = ${firmware.lib_deps}

; S2 — PN532 over SPI3, NDEF on MIFARE Classic, RF field control
[env:s2_nfc]
build_src_filter = +<spikes/s2_nfc/>
lib_deps =
  https://github.com/Seeed-Studio/Seeed_Arduino_NFC.git#3a55a631f23e986babf5e5fa625cc43d1bf99897

; S3 + S4 — TLS to api.spotify.com, keep-alive, and a Spotify Web API console
[env:s3_net]
build_src_filter = +<spikes/s3_net/>
lib_deps =
  bblanchon/ArduinoJson@7.4.3
