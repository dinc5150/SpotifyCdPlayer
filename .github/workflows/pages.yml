# Publishes relay/ (the Spotify OAuth relay page) to GitHub Pages.
# Enable it once: repo Settings → Pages → Source: GitHub Actions.
# The page is then at https://<user>.github.io/<repo>/ — register that exact URL
# as a Redirect URI in your Spotify developer app.
name: Deploy relay page

on:
  push:
    branches: [main]
    paths: [relay/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: relay
      - id: deployment
        uses: actions/deploy-pages@v4
